name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Deploys a ref by hand. Rollback by commit requires a compatible schema;
  # committed 0006 requires restoring the pre-contract backup first.
  # See docs/operations/organisations-rollout.md before dispatching.
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  api:
    name: Go API
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: api/go.mod
          cache-dependency-path: api/go.sum

      - name: Build and vet
        working-directory: api
        run: |
          go build ./...
          go vet ./...

      - name: Check vulnerable dependencies
        working-directory: api
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 -test ./...

      - name: Check formatting
        working-directory: api
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "these files need gofmt:"
            echo "$unformatted"
            exit 1
          fi

      # Integration tests start real Postgres containers through
      # testcontainers, which needs the Docker daemon the runner already has.
      - name: Test
        working-directory: api
        run: go test -count=1 ./...

  web:
    name: Web app
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install
        working-directory: web
        run: npm ci

      - name: Audit dependencies
        working-directory: web
        run: npm audit --audit-level=low

      - name: Typecheck
        working-directory: web
        run: npx tsc --noEmit

      - name: Test
        working-directory: web
        run: npx vitest run

      - name: Build
        working-directory: web
        run: npm run build

  cli:
    name: CLI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: cli/go.mod
          cache-dependency-path: cli/go.sum
      - name: Build, vet, and test
        working-directory: cli
        run: |
          test -z "$(gofmt -l .)"
          go vet ./...
          go test -count=1 ./...
      - name: Check vulnerable dependencies
        working-directory: cli
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 ./...
      # cmd/velvet's tests also check that the plugin skills name only real
      # commands; this checks the manifests and skill front matter.
      - name: Validate agent plugin
        run: |
          python3 - <<'PY'
          import json, pathlib, re, sys
          root = pathlib.Path("plugins/velvet")
          for path in [root / "plugin.json", root / ".claude-plugin/plugin.json",
                       pathlib.Path(".claude-plugin/marketplace.json"), pathlib.Path(".agents/plugins/marketplace.json")]:
              json.loads(path.read_text())
          bad = []
          for skill in sorted(root.glob("skills/*/SKILL.md")):
              text = skill.read_text()
              match = re.match(r"^---\n(.*?)\n---\n", text, re.S)
              fields = dict(line.split(":", 1) for line in match.group(1).splitlines()) if match else {}
              name, desc = fields.get("name", "").strip(), fields.get("description", "").strip()
              if name != skill.parent.name or not re.fullmatch(r"[a-z0-9]+(-[a-z0-9]+)*", name):
                  bad.append(f"{skill}: name must match its folder in hyphen-case")
              if not desc or len(desc) > 1024 or "<" in desc or ">" in desc:
                  bad.append(f"{skill}: description must be 1-1024 characters without angle brackets")
          if bad:
              sys.exit("\n".join(bad))
          print("plugin manifests and skills are valid")
          PY

  e2e:
    name: End to end
    runs-on: ubuntu-latest
    # The whole production stack is built here, so run it only once the units
    # are green rather than paying for it on every broken commit.
    needs: [api, web, cli]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: e2e/package-lock.json

      # cli.spec.ts builds the velvet binary and drives it against the stack.
      - uses: actions/setup-go@v7
        with:
          go-version-file: cli/go.mod
          cache-dependency-path: cli/go.sum

      - name: Install
        working-directory: e2e
        run: npm ci

      - name: Install Chromium
        working-directory: e2e
        run: npx playwright install --with-deps chromium

      # Playwright's webServer brings up the real Compose stack: this suite
      # covers the deployment as well as the code, which is where several of
      # this project's worst bugs actually lived.
      - name: Test
        working-directory: e2e
        run: npx playwright test

      - name: Tear down
        if: always()
        working-directory: e2e
        run: ./stack-down.sh

      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: e2e/playwright-report/
          retention-days: 7

  # Everything below runs only for a push to main or a manual dispatch, never
  # for a pull request: a PR must not be able to publish images or reach the
  # production host.
  images:
    name: Build images
    runs-on: ubuntu-latest
    needs: [api, web]
    if: github.event_name != 'pull_request'
    steps:
      - uses: actions/checkout@v7

      # Registry names must be lowercase and the repository owner is not.
      - name: Name the images
        run: echo "IMAGE_REPO=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The production host is x86; the images are built for it here so the
      # host itself never has to compile anything. Every build is tagged with
      # its commit so a deploy is reproducible. Older tags require a compatible
      # schema; 0006 rollback needs a restore first. `latest` only moves on main.
      - name: Build and push api
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.api
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.IMAGE_REPO }}/api:sha-${{ github.sha }}
            ${{ github.ref == 'refs/heads/main' && format('{0}/api:latest', env.IMAGE_REPO) || '' }}
          cache-from: type=gha,scope=api
          cache-to: type=gha,scope=api,mode=max

      - name: Build and push web
        uses: docker/build-push-action@v7
        with:
          context: .
          file: web/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.IMAGE_REPO }}/web:sha-${{ github.sha }}
            ${{ github.ref == 'refs/heads/main' && format('{0}/web:latest', env.IMAGE_REPO) || '' }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,scope=web,mode=max

  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs: [e2e, images]
    if: github.event_name != 'pull_request'
    # One deploy at a time. Two overlapping pushes would otherwise race to
    # restart the same containers.
    concurrency:
      group: production
      cancel-in-progress: false
    steps:
      - name: Prepare SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy
          chmod 600 ~/.ssh/deploy
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts

      # The host key is restricted to one command, which checks out this
      # commit and runs deploy/remote-deploy.sh. The registry token goes over
      # stdin so the host can pull the private images without a stored
      # credential; it expires with this job.
      - name: Deploy ${{ github.sha }}
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER || 'ubuntu' }}
        run: |
          printf '%s' "${{ secrets.GITHUB_TOKEN }}" | \
            ssh -i ~/.ssh/deploy -o BatchMode=yes "$DEPLOY_USER@$DEPLOY_HOST" "${{ github.sha }}"
