name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  api:
    name: Go API
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: '1.26'
          cache-dependency-path: api/go.sum

      - name: Build and vet
        working-directory: api
        run: |
          go build ./...
          go vet ./...

      - name: Check formatting
        working-directory: api
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "these files need gofmt:"
            echo "$unformatted"
            exit 1
          fi

      # Integration tests start real Postgres containers through
      # testcontainers, which needs the Docker daemon the runner already has.
      - name: Test
        working-directory: api
        run: go test -count=1 ./...

  web:
    name: Web app
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install
        working-directory: web
        run: npm ci

      - name: Typecheck
        working-directory: web
        run: npx tsc --noEmit

      - name: Test
        working-directory: web
        run: npx vitest run

      - name: Build
        working-directory: web
        run: npm run build

  e2e:
    name: End to end
    runs-on: ubuntu-latest
    # The whole production stack is built here, so run it only once the units
    # are green rather than paying for it on every broken commit.
    needs: [api, web]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: e2e/package-lock.json

      - name: Install
        working-directory: e2e
        run: npm ci

      - name: Install Chromium
        working-directory: e2e
        run: npx playwright install --with-deps chromium

      # Playwright's webServer brings up the real Compose stack: this suite
      # covers the deployment as well as the code, which is where several of
      # this project's worst bugs actually lived.
      - name: Test
        working-directory: e2e
        run: npx playwright test

      - name: Tear down
        if: always()
        working-directory: e2e
        run: ./stack-down.sh

      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: e2e/playwright-report/
          retention-days: 7
