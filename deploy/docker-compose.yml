name: worklog

# Each buildable service also names its image in the registry. `up --build`
# still builds locally and tags the result with that name, so development and
# the end-to-end suite are unchanged; a production host runs `pull` instead
# and never needs to compile anything. IMAGE_TAG pins a deploy to one commit.
x-api-image: &api-image ${IMAGE_REPO:-ghcr.io/narayanasabari/velvet}/api:${IMAGE_TAG:-latest}
x-web-image: &web-image ${IMAGE_REPO:-ghcr.io/narayanasabari/velvet}/web:${IMAGE_TAG:-latest}

services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-worklog}
    volumes:
      # Postgres 18 keeps its data in a version-named subdirectory, so the
      # mount belongs one level up. Mounting /var/lib/postgresql/data instead
      # leaves the volume empty and the container never becomes healthy.
      - pgdata:/var/lib/postgresql
    healthcheck:
      # -h localhost forces TCP. The image's first-boot init runs a temporary
      # server that listens only on the unix socket; without -h that server
      # passes the check, migrate connects during the restart that follows,
      # and fails with "the database system is starting up".
      test: ["CMD-SHELL", "pg_isready -h localhost -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 30s
    restart: unless-stopped

  # Migrations run exactly once, before anything that reads the schema starts.
  # Letting api and worker each migrate on boot would race two writers against
  # the same DDL.
  migrate:
    image: *api-image
    build:
      context: ..
      dockerfile: Dockerfile.api
    command: ["migrate"]
    environment:
      DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL}
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    image: *api-image
    build:
      context: ..
      dockerfile: Dockerfile.api
    command: ["serve"]
    environment:
      DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL}
      BASE_URL: ${BASE_URL:?set BASE_URL}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      MAIL_FROM: ${MAIL_FROM:-}
      # Only Caddy may supply forwarded client addresses.
      TRUSTED_PROXY_CIDRS: ${PROXY_CADDY_IP:-172.30.75.2}/32
      GITHUB_APP_CLIENT_ID: ${GITHUB_APP_CLIENT_ID:-}
      GITHUB_APP_CLIENT_SECRET: ${GITHUB_APP_CLIENT_SECRET:-}
      GITHUB_APP_SLUG: ${GITHUB_APP_SLUG:-}
      GITHUB_AUTHORIZATION_URL: ${GITHUB_AUTHORIZATION_URL:-}
      GITHUB_TOKEN_URL: ${GITHUB_TOKEN_URL:-}
      GITHUB_INSTALLATION_URL: ${GITHUB_INSTALLATION_URL:-}
      GITHUB_WEBHOOK_SECRET: ${GITHUB_WEBHOOK_SECRET}
      GITHUB_APP_ID: ${GITHUB_APP_ID}
      GITHUB_APP_PRIVATE_KEY: ${GITHUB_APP_PRIVATE_KEY}
      # Empty in normal use; set for GitHub Enterprise or a local stub.
      GITHUB_API_URL: ${GITHUB_API_URL:-}
    depends_on:
      migrate:
        condition: service_completed_successfully
    networks:
      default:
      proxy:
        ipv4_address: ${PROXY_API_IP:-172.30.75.3}
    restart: unless-stopped

  worker:
    image: *api-image
    build:
      context: ..
      dockerfile: Dockerfile.api
    command: ["worker"]
    environment:
      DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL}
      BASE_URL: ${BASE_URL:?set BASE_URL}
      # Optional, matching config.Load: the worker starts before GitHub is
      # configured and simply has nothing to sync until it is.
      GITHUB_APP_ID: ${GITHUB_APP_ID}
      GITHUB_APP_PRIVATE_KEY: ${GITHUB_APP_PRIVATE_KEY}
      # Empty in normal use; set for GitHub Enterprise or a local stub.
      GITHUB_API_URL: ${GITHUB_API_URL:-}
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  # Build-only service: it copies the SPA build into the shared volume Caddy
  # serves from, then exits 0.
  web:
    image: *web-image
    build:
      context: ..
      dockerfile: web/Dockerfile
    volumes:
      - webdist:/srv
    command: ["sh", "-c", "rm -rf /srv/* && cp -a /dist/. /srv/"]
    restart: "no"

  caddy:
    image: caddy:2-alpine
    ports:
      # SITE_ADDRESS decides which port Caddy listens on inside the container,
      # so the mapping has to target that same port rather than a fixed 80.
      # A site address like http://localhost:8088 otherwise leaves Caddy
      # listening on 8088 while the mapping points at 80, and every request
      # is refused.
      - "${HTTP_PORT:-80}:${CADDY_HTTP_PORT:-80}"
      - "${HTTPS_PORT:-443}:${CADDY_HTTPS_PORT:-443}"
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:?set SITE_ADDRESS}
    networks:
      proxy:
        ipv4_address: ${PROXY_CADDY_IP:-172.30.75.2}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - webdist:/srv:ro
      - caddydata:/data
    depends_on:
      api:
        condition: service_started
      web:
        condition: service_completed_successfully
    restart: unless-stopped

volumes:
  pgdata:
  caddydata:
  webdist:

networks:
  default:
  proxy:
    ipam:
      config:
        - subnet: ${PROXY_SUBNET:-172.30.75.0/24}
