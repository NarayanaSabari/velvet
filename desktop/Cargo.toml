[package]
name = "velvet-desktop"
version = "0.1.0"
edition = "2024"
publish = false

[features]
ui-tests = ["gpui-kit/test-support"]

[dependencies]
anyhow = "1"
gpui-kit = "=0.7.0"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
smol = "2"
url = "2"

[target.'cfg(target_os = "macos")'.dependencies]
security-framework = "3"

[[example]]
name = "screenshots"
required-features = ["ui-tests"]

[profile.dev]
debug = 0

[profile.release]
strip = true
lto = "thin"
