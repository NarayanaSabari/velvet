[package]
name = "velvet-desktop"
version = "0.8.3"
edition = "2024"
publish = false

[features]
ui-tests = ["gpui-kit/test-support"]

[dependencies]
anyhow = "1"
gpui-kit = "=0.7.0"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls", "gzip", "http2"] }
ring = "0.17"
semver = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
smol = "2"
url = "2"

[target.'cfg(target_os = "macos")'.dependencies]
security-framework = "3"
objc2 = "0.6"
objc2-app-kit = { version = "0.3", features = ["NSGlassEffectView", "NSView", "NSWindow", "NSResponder", "NSGraphics", "NSColor"] }
objc2-foundation = { version = "0.3", features = ["NSGeometry"] }
raw-window-handle = "0.6"

[[example]]
name = "screenshots"
required-features = ["ui-tests"]

[profile.dev]
debug = 0

[profile.release]
strip = true
lto = "thin"
